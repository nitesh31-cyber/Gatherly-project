name: Build backend (compile check)

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download MySQL Connector/J
        run: |
          curl -fL -o mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar

      - name: Compile EventAppMySQL.java
        run: javac -cp mysql-connector-j.jar -d build backend/EventAppMySQL.java

      - name: Upload compiled classes
        uses: actions/upload-artifact@v7
        with:
          name: gatherly-backend-classes
          path: build/
